name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse installed MK PowerShell toolkit
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-ChildItem ".mk/scripts" -File | Where-Object { $_.Extension -in @(".ps1", ".psm1") } | ForEach-Object { $_.FullName })
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "PowerShell parse errors in $file" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }

      - name: Validate repository contracts
        if: github.event_name != 'pull_request'
        run: python3 .mk/scripts/validate_repository.py

      - name: Validate repository contracts and PR project state
        if: github.event_name == 'pull_request'
        run: >-
          python3 .mk/scripts/validate_repository.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
